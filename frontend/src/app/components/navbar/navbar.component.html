<header class="navbar">
  <div class="nav-top">
    <div class="nav-container">
      <!-- Logo -->
      <a routerLink="/" class="logo">
        <span class="logo-shop">Shop</span><span class="logo-easy">Easy</span>
      </a>

      <!-- Search -->
      <div class="search-bar">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Search for products, brands and more…"
          class="search-input"
          id="search-input"
        />
        <button class="search-btn" (click)="onSearch()" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>

      <!-- Nav Actions -->
      <nav class="nav-actions">
        <a href="#" class="nav-btn" id="login-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Login
        </a>
        <a href="#" class="nav-btn" id="wishlist-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          Wishlist
        </a>
        <button class="nav-btn cart-btn" (click)="openCart()" id="cart-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          Cart
          <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Category Bar -->
  <div class="category-bar">
    <div class="nav-container">
      <a
        href="#"
        class="cat-link"
        *ngFor="let cat of categories"
        [class.active]="activeCategory === cat.id"
        (click)="setCategory(cat.id); $event.preventDefault()"
        [id]="'cat-' + cat.id"
      >
        {{ cat.label }}
      </a>
    </div>
  </div>
</header>
